<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Moez Zarrouk — CV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      background: #F9F9F9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 360px;
    }

    h1 {
      color: #1F3864;
      font-size: 24px;
      margin-bottom: 4px;
    }

    p.subtitle {
      color: #2E75B6;
      font-weight: 600;
      margin-bottom: 30px;
    }

    a.btn {
      display: block;
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    a.btn-fr {
      background: #2E75B6;
      color: white;
    }

    a.btn-en {
      background: #EEF4FB;
      color: #1F3864;
      border: 1px solid #2E75B6;
    }

    a.btn:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Moez Zarrouk</h1>
    <p class="subtitle">Data Engineer</p>
    <a class="btn btn-fr" href="MOEZ_ZARROUK_CV_CDI_DATA_JUNIOR.pdf" target="_blank">🇫🇷 Voir le CV (Français)</a>
    <a class="btn btn-en" href="ZARROUK_MOEZ_RESUME_DATA_ENGINEER_JUNIOR.pdf" target="_blank">🇬🇧 View CV (English)</a>
  </div>
</body>

</html>
